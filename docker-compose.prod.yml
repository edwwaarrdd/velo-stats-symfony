# A separate project name, so the production images and containers never
# collide with the development ones and both can stay built side by side.
name: velo-stats-symfony-prod

services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/_healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-velo-stats-symfony}
      DATABASE_URL: "sqlite:////app/database/database.sqlite"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MESSENGER_TRANSPORT_DSN: redis://redis:6379
      RIDES_JSON_PATH: data/rides.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    deploy:
      resources:
        limits:
          cpus: "4"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
