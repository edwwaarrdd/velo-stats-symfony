name: Lint

on: push

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # redis is only here because symfony/redis-messenger declares it, so
          # Composer refuses to install without it.
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, zip, intl, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check the code style
        run: vendor/bin/php-cs-fixer check

      - name: Warm the test container
        # PHPStan reads the compiled container to resolve service types.
        run: php bin/console cache:warmup --env=test

      - name: Analyse
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Lint the configuration
        run: |
          php bin/console lint:yaml config
          php bin/console lint:container
