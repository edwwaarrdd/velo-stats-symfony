# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Comma-separated in the environment, a list here, because that is what
    # NelmioCorsBundle expects.
    app.cors_allowed_origins: '%env(csv:CORS_ALLOWED_ORIGINS)%'

    # Absolute path to the rides JSON export, resolved from the project root so
    # the environment variable can stay relative.
    app.rides_json_path: '%kernel.project_dir%/%env(RIDES_JSON_PATH)%'

    app.velo_antwerp_station_information_url: '%env(VELO_ANTWERP_STATION_INFORMATION_URL)%'
    app.osrm_base_url: '%env(OSRM_BASE_URL)%'
    app.open_meteo_archive_url: '%env(OPEN_METEO_ARCHIVE_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # The request handlers are plain invokable classes rather than
    # controllers, so the kernel needs this tag to resolve them from the
    # container with their constructor dependencies. Tagging by interface means
    # a new endpoint is a new class and no configuration at all.
    _instanceof:
        App\Support\RequestHandler:
            tags: ['controller.service_arguments']

    # The four adapters that talk to the outside world are the only services
    # needing explicit wiring, because each takes a configured URL alongside
    # its autowired dependencies. Everything behind them depends on the
    # interface, not the implementation.
    App\Domain\Stations\Service\VeloAntwerpStationInformationService:
        arguments:
            $stationInformationUrl: '%app.velo_antwerp_station_information_url%'

    App\Domain\Routing\Service\OsrmRouteService:
        arguments:
            $baseUrl: '%app.osrm_base_url%'

    App\Domain\Weather\Service\OpenMeteoWeatherService:
        arguments:
            $archiveUrl: '%app.open_meteo_archive_url%'

    App\Domain\Rides\Service\JsonFileRideService:
        arguments:
            $path: '%app.rides_json_path%'

    App\Domain\Stations\Contract\StationInformationService: '@App\Domain\Stations\Service\VeloAntwerpStationInformationService'
    App\Domain\Routing\Contract\RouteService: '@App\Domain\Routing\Service\OsrmRouteService'
    App\Domain\Weather\Contract\WeatherService: '@App\Domain\Weather\Service\OpenMeteoWeatherService'
    App\Domain\Rides\Contract\RideDataSource: '@App\Domain\Rides\Service\JsonFileRideService'
