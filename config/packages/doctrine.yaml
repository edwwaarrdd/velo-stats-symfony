doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # SQLite has no busy timeout by default, so a worker that finds the
        # database locked fails instead of waiting. Write-ahead logging is
        # switched on by the first migration, because that setting lives in the
        # database file itself rather than on the connection.
        options:
            !php/const PDO::ATTR_TIMEOUT: 5

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # Each test run gets its own throwaway file, so suites never share
            # state and nothing is left behind.
            url: 'sqlite:///%kernel.cache_dir%/test.db'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
