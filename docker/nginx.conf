# The API has no static assets, so nginx does no file lookups: every request is
# handed straight to PHP-FPM over FastCGI.

user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream php {
        server app:9000;
        # Deliberately no `keepalive` here. PHP-FPM dedicates a whole child
        # process to each open FastCGI connection, so idle keep-alive
        # connections from nginx would pin every child in the pool and stall
        # the backend. Upstream keep-alive only pays off when the pool is far
        # larger than the number of connections nginx holds open.
    }

    server {
        listen 8000;
        server_name _;

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
        }
    }
}
