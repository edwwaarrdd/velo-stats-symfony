; A fixed pool sized to the container's CPU allowance. PHP handles one request
; per process, so the worker count is the concurrency this backend can serve.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = static
pm.max_children = 4
pm.max_requests = 0

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
