; PHP recompiles every source file on every request unless OPcache is on. In
; production the code never changes while the container runs, so the compiled
; opcodes are cached indefinitely and timestamp checks are switched off.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit_buffer_size=128M
opcache.jit=tracing

; Development conveniences that cost time on every request.
display_errors=Off
expose_php=Off
